<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairos</title>
    <style>
      /* docs/DESIGN.md "Extension side panel": the app's light palette. Values copied from globals.css; a panel page cannot import it. */
      @font-face { font-family: Urbanist; src: url(fonts/urbanist-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
      :root {
        color-scheme: light;
        --canvas: #f7f7f5; --surface: #fff; --sunk: #edece7; --ink: #1b0624; --action: #160f0c; --action-hover: #2b211c;
        --body: #444; --faint: #5e5566; --rule: #898683; --border: rgb(137 134 131 / 0.4); --edge: inset 0 0 0 1px rgb(0 0 0 / 0.05);
        --lime: #7fee64; --bad: #a3261c;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--body); font: 400 15px/1.5 Urbanist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      h1, h2, p { margin: 0; }
      a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      a:hover { text-decoration-thickness: 2px; }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; background: var(--canvas); border-bottom: 1px solid var(--border); }
      .lockup { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font: 500 16px/1 Urbanist, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; text-decoration: none; }
      .lockup img { display: block; width: auto; height: 22px; }

      .btn { display: inline-flex; flex: 1; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--action); color: #fff; font: 500 14px/1 Urbanist, ui-sans-serif, system-ui, sans-serif; text-decoration: none; cursor: pointer; transition: background-color 0.15s ease-out; }
      .btn:hover { background: var(--action-hover); }
      .btn:active { opacity: 0.8; }
      .btn--ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
      .btn--ghost:hover { background: var(--sunk); }
      .btn--small { flex: none; min-height: 32px; padding: 0 12px; font-size: 13px; position: relative; }
      .btn--small::after { content: ""; position: absolute; inset: -6px 0; }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

      main { display: grid; gap: 16px; padding: 20px 16px 32px; }
      .head h1 { font: 500 22px/1.25 Urbanist, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; color: var(--ink); }
      .head p { margin-top: 4px; }
      .how { font-size: 14px; color: var(--faint); }

      .rows { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
      .row { display: grid; gap: 12px; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--edge); }
      .row h2 { font: 500 16px/1.3 Urbanist, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; color: var(--ink); overflow-wrap: anywhere; }
      .meta { margin-top: 2px; font-size: 14px; color: var(--faint); overflow-wrap: anywhere; }
      .actions { display: flex; gap: 8px; }

      .status { display: flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 1.45; color: var(--body); }
      .status:empty { display: none; }
      .status:focus { outline: none; }
      .status--bad { color: var(--bad); }
      .status a { white-space: nowrap; }
      .square { flex: none; width: 8px; height: 8px; box-shadow: inset 0 0 0 1px var(--ink); translate: 0 -1px; }
      .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1px var(--ink); translate: 0 -1px; }

      .message { display: grid; gap: 12px; justify-items: start; padding: 20px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--edge); }
      .message h1 { font: 500 20px/1.25 Urbanist, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; color: var(--ink); }
      .message .btn { flex: none; }

      .skeleton { height: 124px; border-radius: 16px; background: var(--sunk); }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="lockup" id="home" target="_blank" rel="noreferrer"><img src="kairos-mark.svg" alt="" />Kairos</a>
      <button class="btn btn--ghost btn--small" id="refresh" type="button">Refresh</button>
    </header>
    <main id="main" aria-busy="true">
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
