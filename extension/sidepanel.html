<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairos</title>
    <style>
      :root { color-scheme: light dark; --ink: #14161a; --muted: #5b616b; --line: #e3e5e8; --accent: #1f6f5c; --bg: #fafaf8; }
      @media (prefers-color-scheme: dark) { :root { --ink: #eceef0; --muted: #a2a8b0; --line: #2c3036; --bg: #121417; } }
      body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
      header { padding: 16px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 8px 16px 16px; }
      li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: #fff; cursor: pointer; }
      button[disabled] { opacity: 0.5; cursor: default; }
      .status { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Ready to send</h1>
      <p id="summary">Loading your approved applications…</p>
    </header>
    <ul id="queue"></ul>
    <script src="sidepanel.js"></script>
  </body>
</html>
