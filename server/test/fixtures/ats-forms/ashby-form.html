<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{TITLE}} @ Acme</title></head>
<body>
<div id="root"><h1>{{TITLE}}</h1>
<form method="post" enctype="multipart/form-data" action="">
  <div class="ashby-application-form-field-entry"><label for="_systemfield_name">Name *</label><input type="text" id="_systemfield_name" name="_systemfield_name" required></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_email">Email *</label><input type="email" id="_systemfield_email" name="_systemfield_email" required></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_phone">Phone</label><input type="tel" id="_systemfield_phone" name="_systemfield_phone"></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_linkedin">LinkedIn</label><input type="text" id="_systemfield_linkedin" name="_systemfield_linkedin"></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_resume">Resume *</label><input type="file" id="_systemfield_resume" name="_systemfield_resume" required></div>
  <div class="ashby-application-form-field-entry"><label for="q_why">Why Acme? *</label><textarea id="q_why" name="22222222-2222-4222-8222-222222222222" required></textarea></div>
  <div class="ashby-application-form-field-entry"><label for="q_auth">Are you legally authorized to work in the United States? *</label><select id="q_auth" name="33333333-3333-4333-8333-333333333333" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
  <div class="ashby-application-form-field-entry"><label for="q_spons">Will you now or in the future require visa sponsorship? *</label><select id="q_spons" name="44444444-4444-4444-8444-444444444444" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
  <section><h3>Voluntary self-identification</h3>
    <div class="ashby-application-form-field-entry"><label for="eeo_gender">Gender</label><select id="eeo_gender" name="eeo_gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
    <div class="ashby-application-form-field-entry"><label for="eeo_race">Race/Ethnicity</label><select id="eeo_race" name="eeo_race"><option value="">Select</option><option>Asian</option><option>Decline to self-identify</option></select></div>
    <div class="ashby-application-form-field-entry"><label for="eeo_veteran">Veteran status</label><select id="eeo_veteran" name="eeo_veteran"><option value="">Select</option><option>I am a veteran</option><option>Decline to self-identify</option></select></div>
    <div class="ashby-application-form-field-entry"><label for="eeo_disability">Disability status</label><select id="eeo_disability" name="eeo_disability"><option value="">Select</option><option>Yes</option><option>Decline to self-identify</option></select></div>
  </section>
  <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
</form></div>
</body></html>
