<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme - {{TITLE}}</title></head>
<body>
<div class="posting-page"><h2>{{TITLE}}</h2>
<form id="application-form" method="post" enctype="multipart/form-data" action="">
  <div class="application-question"><label for="resume-upload-input">Resume/CV *</label><input type="file" id="resume-upload-input" name="resume" required></div>
  <div class="application-question"><label for="name">Full name *</label><input type="text" id="name" name="name" required></div>
  <div class="application-question"><label for="email">Email *</label><input type="email" id="email" name="email" required></div>
  <div class="application-question"><label for="phone">Phone</label><input type="tel" id="phone" name="phone"></div>
  <div class="application-question"><label for="org">Current company</label><input type="text" id="org" name="org"></div>
  <div class="application-question"><label for="li">LinkedIn URL</label><input type="text" id="li" name="urls[LinkedIn]"></div>
  <div class="application-question"><label for="github">GitHub URL</label><input type="text" id="github" name="urls[GitHub]"></div>
  <div class="application-question"><label for="portfolio">Portfolio URL</label><input type="text" id="portfolio" name="urls[Portfolio]"></div>
  <div class="application-question"><label for="cf1">What interests you about working at Acme? *</label><textarea id="cf1" name="cards[11111111-1111-4111-8111-111111111111][field0]" required></textarea></div>
  <div class="application-question"><label for="cf2">Are you legally authorized to work in the United States? *</label><select id="cf2" name="cards[11111111-1111-4111-8111-111111111111][field1]" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
  <div class="application-question"><label for="cf3">Will you now or in the future require visa sponsorship? *</label><select id="cf3" name="cards[11111111-1111-4111-8111-111111111111][field2]" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
  <div id="eeo-survey"><h4>Additional information (voluntary)</h4>
    <div class="application-question"><label for="eeo-gender">Gender</label><select id="eeo-gender" name="eeo[gender]"><option value="">Select</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
    <div class="application-question"><label for="eeo-race">Race</label><select id="eeo-race" name="eeo[race]"><option value="">Select</option><option>Asian</option><option>Decline to self-identify</option></select></div>
    <div class="application-question"><label for="eeo-veteran">Veteran status</label><select id="eeo-veteran" name="eeo[veteran]"><option value="">Select</option><option>I am a veteran</option><option>Decline to self-identify</option></select></div>
    <div class="application-question"><label for="eeo-disability">Disability status</label><select id="eeo-disability" name="eeo[disability]"><option value="">Select</option><option>Yes</option><option>Decline to self-identify</option></select></div>
  </div>
  <button type="submit" id="btn-submit" class="postings-btn">Submit application</button>
</form></div>
</body></html>
