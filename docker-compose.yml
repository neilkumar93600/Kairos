# Local infrastructure that mirrors Railway's Postgres and Redis.
#   npm run infra:up      start Postgres + Redis
#   docker compose --profile app up --build   also run api + worker in containers
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: auto_career
      POSTGRES_PASSWORD: auto_career
      POSTGRES_DB: auto_career
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_career"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://auto_career:auto_career@postgres:5432/auto_career
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://auto_career:auto_career@postgres:5432/auto_career
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
