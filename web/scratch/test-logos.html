<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos — Production Logo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0c11;
      color: #edece7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 48px 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.12);
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }
    p {
      color: #9c97a3;
      font-size: 15px;
    }
    .card {
      background: #17151e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .preview-box {
      border-radius: 14px;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }
    .preview-box.linen {
      background: #f7f7f5;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .preview-box.dark {
      background: #110f17;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .nav-mock {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Production Integrated</span>
      <h1>Kairos — Selected Aerodynamic Wing Logo</h1>
      <p>Integrated directly into <code>components/shared/logo.tsx</code>, <code>public/brand/kairos-mark.svg</code>, and <code>app/icon.svg</code>.</p>
    </div>

    <div class="card">
      <div class="card-title">1. On Linen Canvas (#f7f7f5) — Website Navbar & Header</div>
      <div class="preview-box linen">
        <div class="nav-mock" style="color: #1b0624;">
          <svg width="34" height="30" viewBox="0 0 46 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="logomark">
              <path d="M0 33L4.60606 25H12.2448C17.2569 25 21.4947 28.7103 22.1571 33.6784L23 40H13L11.5585 36.6365C10.613 34.4304 8.44379 33 6.04362 33H0Z" fill="#0047C1"/>
              <path d="M46 33L41.3939 25H33.7552C28.7431 25 24.5053 28.7103 23.8429 33.6784L23 40H33L34.4415 36.6365C35.387 34.4304 37.5562 33 39.9564 33H46Z" fill="#0047C1"/>
              <path d="M4.60608 25L18.9999 0H23L22.6032 9.52405C22.2608 17.7406 15.7455 24.3596 7.53539 24.8316L4.60608 25Z" fill="#0047C1"/>
              <path d="M41.3939 25L27.0001 0H23L23.3968 9.52405C23.7392 17.7406 30.2545 24.3596 38.4646 24.8316L41.3939 25Z" fill="#0047C1"/>
            </g>
          </svg>
          Kairos
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. On Dark Mode / App Background</div>
      <div class="preview-box dark">
        <div class="nav-mock" style="color: #ffffff;">
          <svg width="46" height="40" viewBox="0 0 46 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="logomark">
              <path d="M0 33L4.60606 25H12.2448C17.2569 25 21.4947 28.7103 22.1571 33.6784L23 40H13L11.5585 36.6365C10.613 34.4304 8.44379 33 6.04362 33H0Z" fill="#0047C1"/>
              <path d="M46 33L41.3939 25H33.7552C28.7431 25 24.5053 28.7103 23.8429 33.6784L23 40H33L34.4415 36.6365C35.387 34.4304 37.5562 33 39.9564 33H46Z" fill="#0047C1"/>
              <path d="M4.60608 25L18.9999 0H23L22.6032 9.52405C22.2608 17.7406 15.7455 24.3596 7.53539 24.8316L4.60608 25Z" fill="#0047C1"/>
              <path d="M41.3939 25L27.0001 0H23L23.3968 9.52405C23.7392 17.7406 30.2545 24.3596 38.4646 24.8316L41.3939 25Z" fill="#0047C1"/>
            </g>
          </svg>
          Kairos
        </div>
      </div>
    </div>
  </div>
</body>
</html>
