version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the mcr.microsoft.com/playwright tag in server/Dockerfile.applier; bump both by hand.
      - dependency-name: playwright-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  # Refreshes the digest-pinned base images in server/Dockerfile*. The Playwright image is bumped by hand, in step
  # with playwright-core (see the npm ignore above).
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: mcr.microsoft.com/playwright
